services:
  frontend:
    build:
      context: .
      dockerfile: ${BUILD_MODE:-development}.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - IBEAM_GATEWAY_URL=https://ibeam:5000 # Used by the Vite dev server proxy (/v1/api -> gateway)
    stdin_open: ${STDIN_OPEN:-true}  # Enable stdin_open in development for React DevTools, disable in production
    # production: nginx serves dist + proxies /v1/api (nginx.conf); development: Vite dev server + proxy
    command: sh -c "if [ \"$NODE_ENV\" = \"production\" ]; then exec nginx -g 'daemon off;'; else npm install && npm run dev -- --host; fi"
    depends_on:
      - ibeam
    healthcheck:
      # busybox wget; tries https first (dev server with certs), then http
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost:3000 || wget -q --spider http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ibeam:
    image: voyz/ibeam:0.5.13
    ports:
      # Host side defaults to 5050: macOS AirPlay Receiver owns host port 5000. Container side stays 5000.
      - "${IBEAM_HOST_PORT:-5050}:5000"
    env_file:
      - .env
    volumes:
      - ./inputs:/srv/inputs # conf.yaml (+ optional cacert.jks / cacert.pem)
    restart: "no" # Prevents IBEAM_MAX_FAILED_AUTH from being exceeded
    healthcheck:
      # iBeam's own health server: /livez = process alive, /readyz = authenticated
      test: ["CMD", "curl", "-f", "http://localhost:5001/livez"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
